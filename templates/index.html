<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Chest CT Classifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,560;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #e8f1f4;
      --bg-2: #f7fafb;
      --ink: #14313d;
      --muted: #5b7380;
      --line: #c7d8df;
      --panel: rgba(255, 255, 255, 0.78);
      --accent: #0f766e;
      --accent-2: #115e59;
      --danger: #b42318;
      --ok: #027a48;
      --shadow: 0 18px 50px rgba(20, 49, 61, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #cfe8e4 0%, transparent 55%),
        radial-gradient(900px 420px at 100% 0%, #d7e6f2 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    .shell {
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1.75rem;
      animation: rise 0.55s ease both;
    }

    .brand h1 {
      margin: 0;
      font-family: Fraunces, serif;
      font-size: clamp(1.9rem, 3vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand p {
      margin: 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 1.25rem;
      animation: rise 0.7s ease 0.08s both;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(199, 216, 223, 0.9);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      padding: 1.15rem;
    }

    .panel h2 {
      margin: 0 0 0.9rem;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .preview {
      position: relative;
      height: 340px;
      border-radius: 14px;
      border: 1px dashed #9fb6c0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.5), rgba(232,241,244,0.8));
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .preview.empty::before {
      content: "Upload a chest CT scan image";
      color: var(--muted);
      font-size: 0.95rem;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #0b1c24;
    }

    .preview.has-image img { display: block; }
    .preview.has-image.empty::before { display: none; }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    button:active { transform: translateY(1px); }

    #uload {
      flex: 1;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    #uload:hover { background: #f3f8fa; }

    #send {
      flex: 1;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
    }

    #send:hover { filter: brightness(1.05); }

    #send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result-box {
      min-height: 340px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.75rem;
    }

    .result-label {
      font-family: Fraunces, serif;
      font-size: 1.7rem;
      font-weight: 560;
      line-height: 1.2;
      opacity: 0;
      transform: translateY(8px);
    }

    .result-label.show {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .result-label.cancer { color: var(--danger); }
    .result-label.normal { color: var(--ok); }

    .result-hint {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      background: rgba(232, 241, 244, 0.72);
      backdrop-filter: blur(3px);
    }

    #loading.show { display: grid; }

    .loader {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 4px solid #d5e4ea;
      border-top-color: var(--accent);
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .preview, .result-box { min-height: 280px; height: 280px; }
      .result-box { height: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <h1>Chest CT Classifier</h1>
      <p>Upload a chest CT scan to classify adenocarcinoma vs normal tissue.</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Input scan</h2>
        <div class="preview empty" id="preview">
          <img src="" alt="Uploaded CT scan preview" id="photo">
        </div>
        <div class="actions">
          <button type="button" id="uload">Upload image</button>
          <button type="button" id="send" disabled>Predict</button>
        </div>
        <input type="hidden" id="url" value="{{ predict_url }}">
        <input type="file" id="fileinput" accept="image/*" hidden>
      </section>

      <section class="panel">
        <h2>Prediction</h2>
        <div class="result-box">
          <div class="result-label" id="resultLabel">Waiting for an image</div>
          <p class="result-hint" id="resultHint">Choose a CT image, then run prediction.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="loading"><div class="loader" aria-label="Loading"></div></div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script>
    var base_data = "";

    function setResult(label, hint) {
      var el = $("#resultLabel");
      el.removeClass("show cancer normal");
      el.text(label);
      if (label.toLowerCase().indexOf("normal") >= 0) el.addClass("normal");
      if (label.toLowerCase().indexOf("cancer") >= 0) el.addClass("cancer");
      requestAnimationFrame(function () { el.addClass("show"); });
      $("#resultHint").text(hint || "");
    }

    function sendRequest(base64Data) {
      if (!base64Data) {
        setResult("No image selected", "Upload a chest CT image first.");
        return;
      }
      $("#loading").addClass("show");
      $.ajax({
        url: $("#url").val(),
        type: "post",
        cache: false,
        async: true,
        crossDomain: true,
        headers: { "Content-Type": "application/json" },
        data: JSON.stringify({ image: base64Data }),
        success: function (res) {
          var label = "Unknown";
          try { label = res[0].image; } catch (e) {}
          setResult(label, "Prediction completed successfully.");
          $("#loading").removeClass("show");
        },
        error: function () {
          setResult("Prediction failed", "Check that the Flask app is running and try again.");
          $("#loading").removeClass("show");
        }
      });
    }

    $(document).ready(function () {
      $("#uload").click(function () {
        $("#fileinput").trigger("click");
      });

      $("#send").click(function () {
        sendRequest(base_data);
      });

      $("#fileinput").change(function () {
        if (!(this.files && this.files[0])) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          var url = e.target.result;
          var img = new Image();
          img.onload = function () {
            var canvas = document.createElement("CANVAS");
            var ctx = canvas.getContext("2d");
            canvas.height = this.height;
            canvas.width = this.width;
            ctx.drawImage(this, 0, 0);
            base_data = canvas.toDataURL("image/jpeg", 1.0).replace(/^data:image.+;base64,/, "");
            canvas = null;
            $("#photo").attr("src", url);
            $("#preview").addClass("has-image").removeClass("empty");
            $("#send").prop("disabled", false);
            setResult("Image ready", "Click Predict to classify this scan.");
          };
          img.src = url;
        };
        reader.readAsDataURL(this.files[0]);
      });
    });
  </script>
</body>
</html>
